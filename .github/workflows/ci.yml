name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - run: bun run check:workspace-lock
      - run: bun run types
      - run: bun run build
      - run: bun test scripts/check-pi-dist-imports.test.ts
      - run: bun run check:pi-dist-imports
      - run: bun run check:claustrum-golden
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: bun test scripts/check-test-count-floors.test.ts
      # UNCHECKED exits nonzero too: a missing merge target must not look green.
      - run: bun scripts/check-test-count-floors.ts --base-ref "${{ github.event.pull_request.base.sha }}"
      - run: bun run --cwd packages/opencode smoke:tui
        env:
          TUI_SMOKE_SKIP_BUILD: "1"
      - run: bun run test:pi-host
      - run: npm install -g opencode-ai@1.18.18
      - run: bun run test:e2e
      - run: bun run format:check
      - run: bun run lint
