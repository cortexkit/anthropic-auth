name: Windows packed setup

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      version:
        type: string
        required: false
  push:
    branches: [main, 'windows-verify/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install locked build dependencies
        run: bun install --frozen-lockfile
      - name: Sync requested release version
        if: inputs.version != ''
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/version-sync.mjs "${REQUESTED_VERSION#v}"
      - name: Build release packages
        run: bun run build
      - name: Pack Core, OpenCode and Pi
        run: |
          PACKS="$RUNNER_TEMP/anthropic-packed"
          mkdir -p "$PACKS"
          npm pack ./packages/core --ignore-scripts --pack-destination "$PACKS"
          npm pack ./packages/opencode --ignore-scripts --pack-destination "$PACKS"
          npm pack ./packages/pi --ignore-scripts --pack-destination "$PACKS"
      - name: Prove installed packed readers before Windows dispatch
        run: node --experimental-import-meta-resolve scripts/windows/prove-packed-readers.mjs "$RUNNER_TEMP/anthropic-packed" "$RUNNER_TEMP/anthropic-producer-readers.json"
      - name: Upload portable reader receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anthropic-producer-readers
          path: ${{ runner.temp }}/anthropic-producer-readers.json
          if-no-files-found: warn
      - name: Upload package tarballs
        uses: actions/upload-artifact@v7
        with:
          name: anthropic-release-packages
          path: ${{ runner.temp }}/anthropic-packed/*.tgz
          if-no-files-found: error
          overwrite: true
  packed-setup:
    needs: [build-packages]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download package tarballs
        uses: actions/download-artifact@v8
        with:
          name: anthropic-release-packages
          path: ${{ runner.temp }}/anthropic-packed
      - name: Verify installed packages under Node and retain receipt
        run: |
          $packs = Join-Path $env:RUNNER_TEMP 'anthropic-packed'
          $receipt = Join-Path $env:RUNNER_TEMP 'anthropic-windows-receipt.json'
          $env:ANTHROPIC_NPM_CLI = Join-Path (Split-Path (Get-Command node).Source) 'node_modules/npm/bin/npm-cli.js'
          node --experimental-import-meta-resolve scripts/windows/verify.mjs $packs $receipt
          exit $LASTEXITCODE
      - name: Upload Windows receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anthropic-windows-${{ matrix.os }}-node24
          path: ${{ runner.temp }}/anthropic-windows-receipt.json
          if-no-files-found: error
