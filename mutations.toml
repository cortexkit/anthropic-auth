file = "packages/core/src/native-account-runtime.ts"
old = "nextRetryAt: retrying ? policy.checkedAt : policy.nextRetryAt,"
new = "nextRetryAt: retrying ? policy.nextRetryAt : policy.nextRetryAt,"
test_file = "packages/core/src/tests/native-account-runtime.test.ts"
runner = "command"
command = ["bun", "scripts/run-mutation-bun.ts", "packages/core/src/tests/native-account-runtime.test.ts", "{test}"]
