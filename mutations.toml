broad_id = "{name}"

[[control]]
id = "runtime-owner-loss-is-publication-refusal"
guards = "Lost writer ownership must not license display through the I/O failure exception."
file = "packages/core/src/native-runtime.ts"
old = '''          try {
            await lock.assertOwned()
          } catch {
            throw new NativeRuntimeError('publication-refused')
          }'''
new = '''          await lock.assertOwned()'''
test_file = "packages/core/src/tests/native-runtime.test.ts"
runner = "command"
