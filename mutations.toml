broad_command = ["bun", "scripts/run-mutation-bun.ts", "--broad", "packages/core", "tmp/mutations/core.xml"]
broad_report = "tmp/mutations/core.xml"
broad_id = "{name}"

[[control]]
id = "profile-current-credential-display"
guards = "A fetched tier after a failed write must not be displayed for changed credentials."
file = "packages/opencode/src/index.ts"
old = "!(await hydration.isCurrent?.())"
new = "false"
test_file = "packages/opencode/src/tests/index.test.ts"
runner = "command"
